# Evaluation config — 02_RSwinUNet_SRx8_Filter_InbaL1BCE_LW evaluated on the held-out validation split.
# Ablation study (val-set only): run this model on val, save predicted flood
# maps, then aggregate GLOBAL metrics with tools/eval_flood.py (patch-mean
# metrics from training are not comparable across full scenes). Inputs use
# train-set normalization stats; EMA weights loaded (params_ema).
# network_g: RSwinUNet

# general settings
name: 02_RSwinUNet_SRx8_Filter_InbaL1BCE_LW_eval_val_pbs
model_type: FMSRModel
scale: 8
num_gpu: 1
manual_seed: 61

# find_unused_parameters needs to be true, otherwise it will affect performance

# dataset and data loader lsettings
datasets:
  val_1:
    name: FloodMapSR-Val-h
    type: PairedFloodMapDataset
    dataroot: /esi/project/niwa04345/luoz/AIFloodModel/dataset_ds8_filtered_thr0p1_min5100_full
    index_csv: /esi/project/niwa04345/luoz/AIFloodModel/dataset_ds8_filtered_thr0p1_min5100_full/index_with_interval_stats_h_niwa.csv
    io_backend:
      type: disk

    phase: val
    target_var: h
    aux_vars: [zs, dem]
    scale: 8
    patch_fine: 512
    patch_coarse: 64

    split_cfg:
      by: scenario
      val_ratio: 0.2
      seed: 61
      split_stats_json: /esi/project/niwa04345/luoz/AIFloodModel/dataset_ds8_filtered_thr0p1_min5100_full/split_stats_h_asinh.json
    stats:
      calculate_if_missing: false
      use_clip_coarse: false
      use_clip_static: false
      norm: zscore
      transform: asinh
      h_asinh_q: 90

# network structures
network_g:
  type: RSwinUNet
  upscale: 8
  img_size: 512
  coarse_in_chans: 3
  static_in_chans: 7
  patch_size: 4
  embed_dim: 96
  depths: [2, 2, 2, 2]
  depths_decoder: [1, 2, 2, 2]
  num_heads: [3, 6, 12, 24]
  window_size: 8
  mlp_ratio: 4.0
  drop_path_rate: 0.1
  num_flood_classes: 3
  coarse_upsample_mode: bilinear
  use_checkpoint: false   # RSwinUNet runs stage0 attn at 128x128 for 512 patches; flip to true if OOM

# path
path:
  pretrain_network_g: /esi/project/niwa04345/luoz/AIFloodModel/experiments/02_RSwinUNet_SRx8_Filter_InbaL1BCE_LW_pbs/models/net_g_600000.pth
  strict_load_g: yes
  # load EMA weights into net_g so eval matches training-val numbers.
  param_key_g: params_ema

# validation settings
val:
  save_flood_map: true
  suffix: ~

  metrics:
    rmse:
      type: cal_rmse_pt
      reduction: mean
      better: lower
    rmse_thr:
      type: cal_rmse_threshold_pt
      reduction: mean
      threshold: 0.1
      better: lower
    rmse_thr_tol:
      type: cal_rmse_threshold_tolerant_pt
      reduction: mean
      threshold: 0.1
      abs_tol: 0.02
      better: lower
    rmse_all:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: ~
      better: lower
    rmse_nonflood01:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.0
      cond_on_target_lt: 0.1
      better: lower
    rmse_nonflood01_tol:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.0
      cond_on_target_lt: 0.1
      abs_tol: 0.02
      better: lower
    rmse_slight01_05:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.1
      cond_on_target_lt: 0.5
      better: lower
    rmse_slight01_05_tol:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.1
      cond_on_target_lt: 0.5
      abs_tol: 0.02
      better: lower
    rmse_severe05_1:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.5
      cond_on_target_lt: 1
      better: lower
    rmse_severe05_1_tol:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.5
      cond_on_target_lt: 1
      abs_tol: 0.02
      better: lower
    rmse_extreme1:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 1
      cond_on_target_lt: ~
      better: lower
    rmse_extreme1_tol:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 1
      cond_on_target_lt: ~
      abs_tol: 0.02
      better: lower

    nse:
      type: cal_nse_pt
      reduction: mean
      better: higher
    nse_safe:
      type: cal_nse_pt_safe
      reduction: mean
      min_var: 1.0e-6
      abs_tol_per_px: 1.0e-4
      lower_bound: -5.0
      better: higher
    nse_thr01_safe:
