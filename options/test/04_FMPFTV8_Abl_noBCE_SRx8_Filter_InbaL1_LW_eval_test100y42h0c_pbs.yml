# Evaluation config — 04_FMPFTV8_Abl_noBCE_SRx8_Filter_InbaL1_LW evaluated on the 100-year / 42 h designed-rainfall test scenario.
# Ablation study (test set): run this model on the test scenario, save predicted flood
# maps, then aggregate GLOBAL metrics with tools/eval_flood.py (patch-mean
# metrics from training are not comparable across full scenes). Inputs use
# train-set normalization stats; EMA weights loaded (params_ema).
# network_g: FloodMapPFTV8

# general settings
name: 04_FMPFTV8_Abl_noBCE_SRx8_Filter_InbaL1_LW_eval_test100y42h0c_pbs
model_type: FMSRModel
scale: 8
num_gpu: 1
manual_seed: 61

# find_unused_parameters needs to be true, otherwise it will affect performance

# dataset and data loader lsettings
datasets:
  test_1:
    name: FloodMapSR-Test-100y42h0c-h
    type: PairedFloodMapDataset
    dataroot: /esi/project/niwa04345/luoz/AIFloodModel/testdataset_100y42h0c
    index_csv: /esi/project/niwa04345/luoz/AIFloodModel/testdataset_100y42h0c/index_niwa.csv
    io_backend:
      type: disk

    phase: test
    target_var: h
    aux_vars: [zs, dem]
    scale: 8
    patch_fine: 512
    patch_coarse: 64

    split_cfg:
      by: scenario
      val_ratio: 0.2
      seed: 61
      split_stats_json: /esi/project/niwa04345/luoz/AIFloodModel/dataset_ds8_filtered_thr0p1_min5100_full/split_stats_h_asinh.json
    stats:
      calculate_if_missing: false
      use_clip_coarse: false
      use_clip_static: false
      norm: zscore
      transform: asinh
      h_asinh_q: 90

# network structures
network_g:
  type: FloodMapPFTV8
  upscale: 8
  coarse_in_chans: 3
  static_in_chans: 7
  flood_map_size: 64
  use_shallow_act: true
  use_decoder_act: true
  use_global_residual: true
  use_aoi_gate: true
  aoi_alpha: 0.5
  couple_mode: none
  couple_eps: 0.2
  embed_dim: 96
  depths: [2, 4, 6, 6]
  num_heads: 6
  num_topk: [ 256, 256,
              128, 128, 128, 128,
              64, 64, 64, 64, 64, 64,
              32, 32, 32, 32, 32, 32,]
  window_size: 16
  convffn_kernel_size: 7
  mlp_ratio: 2.
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'
  use_checkpoint: false

# path
path:
  pretrain_network_g: /esi/project/niwa04345/luoz/AIFloodModel/experiments/04_FMPFTV8_Abl_noBCE_SRx8_Filter_InbaL1_LW_pbs/models/net_g_600000.pth
  strict_load_g: yes
  # load EMA weights into net_g so eval matches training-val numbers.
  param_key_g: params_ema

# validation settings
val:
  save_flood_map: true
  suffix: ~

  metrics:
    rmse:
      type: cal_rmse_pt
      reduction: mean
      better: lower
    rmse_thr:
      type: cal_rmse_threshold_pt
      reduction: mean
      threshold: 0.1
      better: lower
    rmse_thr_tol:
      type: cal_rmse_threshold_tolerant_pt
      reduction: mean
      threshold: 0.1
      abs_tol: 0.02
      better: lower
    rmse_all:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: ~
      better: lower
    rmse_nonflood01:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.0
      cond_on_target_lt: 0.1
      better: lower
    rmse_nonflood01_tol:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.0
      cond_on_target_lt: 0.1
      abs_tol: 0.02
      better: lower
    rmse_slight01_05:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.1
      cond_on_target_lt: 0.5
      better: lower
    rmse_slight01_05_tol:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.1
      cond_on_target_lt: 0.5
      abs_tol: 0.02
      better: lower
    rmse_severe05_1:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.5
      cond_on_target_lt: 1
      better: lower
    rmse_severe05_1_tol:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.5
      cond_on_target_lt: 1
      abs_tol: 0.02
      better: lower
    rmse_extreme1:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 1
      cond_on_target_lt: ~
      better: lower
    rmse_extreme1_tol:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 1
      cond_on_target_lt: ~
      abs_tol: 0.02
      better: lower

    nse:
      type: cal_nse_pt
      reduction: mean
      better: higher
    nse_safe:
      type: cal_nse_pt_safe
      reduction: mean
      min_var: 1.0e-6
      abs_tol_per_px: 1.0e-4
      lower_bound: -5.0
      better: higher
    nse_thr01_safe:
      type: cal_nse_threshold_pt_safe
      reduction: mean
      min_var: 1.0e-6
      abs_tol_per_px: 1.0e-4
      lower_bound: -5.0
      threshold: 0.1
      better: higher
    nse_thr01_tol_safe:
      type: cal_nse_threshold_tolerant_pt_safe
      reduction: mean
      min_var: 1.0e-6
      abs_tol_per_px: 1.0e-4
      lower_bound: -5.0
      threshold: 0.1
      abs_tol: 0.02
      better: higher

    csi_thr01:
      type: cal_csi_pt
      threshold: 0.1
      reduction: mean
      empty_as_nan: true
      better: higher
    csi_thr01_tol:
      type: cal_csi_tolerant_pt
      threshold: 0.1
      reduction: mean
      abs_tol: 0.02
      empty_as_nan: true
      better: higher

    precision_thr01:
      type: cal_precision_pt
      threshold: 0.1
      reduction: mean
      empty_as_nan: true
      better: higher
    precision_thr01_tol:
      type: cal_precision_tolerant_pt
      threshold: 0.1
      reduction: mean
      empty_as_nan: true
      abs_tol: 0.02
      better: higher
    precision_nonflood01:
      type: cal_precision_band_pt
      band_ge: 0.0
      band_lt: 0.1
      reduction: mean
      empty_as_nan: true
      better: higher
    precision_slight01_05:
      type: cal_precision_band_pt
      band_ge: 0.1
      band_lt: 0.5
      reduction: mean
      empty_as_nan: true
      better: higher
    precision_severe05_1:
      type: cal_precision_band_pt
      band_ge: 0.5
      band_lt: 1
      reduction: mean
      empty_as_nan: true
      better: higher
    precision_extreme1:
      type: cal_precision_band_pt
      band_ge: 1
      band_lt: ~
      reduction: mean
      empty_as_nan: true
      better: higher

    recall_thr01:
      type: cal_recall_pt
      threshold: 0.1
      reduction: mean
      empty_as_nan: true
      better: higher
    recall_thr01_tol:
      type: cal_recall_tolerant_pt
      threshold: 0.1
      reduction: mean
      empty_as_nan: true
      abs_tol: 0.02
      better: higher
    recall_nonflood01:
      type: cal_recall_band_pt
      band_ge: 0.0
      band_lt: 0.1
      reduction: mean
      empty_as_nan: true
      better: higher
    recall_slight01_05:
      type: cal_recall_band_pt
      band_ge: 0.1
      band_lt: 0.5
      reduction: mean
      empty_as_nan: true
      better: higher
    recall_severe05_1:
      type: cal_recall_band_pt
      band_ge: 0.5
      band_lt: 1
      reduction: mean
      empty_as_nan: true
      better: higher
    recall_extreme1:
      type: cal_recall_band_pt
      band_ge: 1
      band_lt: ~
      reduction: mean
      empty_as_nan: true
      better: higher

    target_prevalence:
      type: cal_prev_t_pt
      threshold: 0.1
      reduction: mean
    pred_prevalence:
      type: cal_prev_p_pt
      threshold: 0.1
      reduction: mean
