# Evaluation config — 01 FMPFTV8 (TG-PFT) main model, final checkpoint, on the 50-year / 42 h designed-rainfall test scenario.
# x-velocity (u), 8x downscaling (64 m -> 8 m). Saves predicted flood maps for
# global-metric aggregation via tools/eval_flood.py. Inputs normalized with
# train-set statistics (asinh + z-score, q=90); EMA weights loaded (params_ema).
# general settings
name: 01_FMPFTV8_SRx8_Filter_InbaL1BCE_LW_u_eval_test50y42h0c
model_type: FMSRModel
scale: 8
num_gpu: 1
manual_seed: 61

# dataset and data loader lsettings
datasets:
  test_1:
    name: FloodMapSR-Test-50y42h0c-u
    type: PairedFloodMapDataset
    dataroot: /nesi/nobackup/uoa04425/zluo784/Exp1/AIFloodModel/testdataset_50y42h0c
    index_csv: /nesi/nobackup/uoa04425/zluo784/Exp1/AIFloodModel/testdataset_50y42h0c/index.csv
    io_backend:
      type: disk

    phase: test
    target_var: u
    aux_vars: [dem]
    scale: 8
    patch_fine: 512
    patch_coarse: 64

    split_cfg:
      by: scenario
      val_ratio: 0.2
      seed: 61
      split_stats_json: /nesi/nobackup/uoa04425/zluo784/Exp1/AIFloodModel/dataset_ds8_filtered_thr0p1_min5100_full/split_stats_u.json
    stats:
      calculate_if_missing: false
      use_clip_coarse: false
      use_clip_static: false
      norm: zscore
      transform: asinh

# network structures
network_g:
  type: FloodMapPFTV8
  upscale: 8
  coarse_in_chans: 2
  static_in_chans: 7
  flood_map_size: 64
  use_shallow_act: true
  use_decoder_act: true
  use_global_residual: true
  use_aoi_gate: true
  aoi_alpha: 0.5
  couple_mode: none
  couple_eps: 0.2
  embed_dim: 96
  depths: [2, 4, 6, 6]
  num_heads: 6
  num_topk: [ 256, 256,
              128, 128, 128, 128,
              64, 64, 64, 64, 64, 64,
              32, 32, 32, 32, 32, 32,]
  window_size: 16
  convffn_kernel_size: 7
  mlp_ratio: 2.
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'
  use_checkpoint: false

# path
path:
  pretrain_network_g: /nesi/nobackup/uoa04425/zluo784/Exp1/AIFloodModel/experiments/01_FMPFTV8_SRx8_Filter_InbaL1BCE_LW_u/models/net_g_1000000.pth
  strict_load_g: yes
  # load the EMA weights into net_g (test mode never builds net_g_ema, and
  # resume_state is ignored outside training) so eval matches the EMA-based
  # validation numbers seen during training.
  param_key_g: params_ema

# validation settings
val:
  save_flood_map: true
  suffix: ~

  # RMSE/NSE on signed velocity; every threshold/band/classification
  # metric uses |v| via use_abs. No logit_metrics for u/v.
  metrics:
    rmse:
      type: cal_rmse_pt
      reduction: mean
      better: lower
    rmse_thr:
      type: cal_rmse_threshold_pt
      reduction: mean
      threshold: 0.1
      use_abs: true
      better: lower
    rmse_thr_tol:
      type: cal_rmse_threshold_tolerant_pt
      reduction: mean
      threshold: 0.1
      abs_tol: 0.02
      use_abs: true
      better: lower
    rmse_all:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: ~
      better: lower
    rmse_nonflood01:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.0
      cond_on_target_lt: 0.1
      use_abs: true
      better: lower
    rmse_nonflood01_tol:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.0
      cond_on_target_lt: 0.1
      abs_tol: 0.02
      use_abs: true
      better: lower
    rmse_slight01_05:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.1
      cond_on_target_lt: 0.5
      use_abs: true
      better: lower
    rmse_slight01_05_tol:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.1
      cond_on_target_lt: 0.5
      abs_tol: 0.02
      use_abs: true
      better: lower
    rmse_severe05_1:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.5
      cond_on_target_lt: 1
      use_abs: true
      better: lower
    rmse_severe05_1_tol:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.5
      cond_on_target_lt: 1
      abs_tol: 0.02
      use_abs: true
      better: lower
    rmse_extreme1:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 1
      cond_on_target_lt: ~
      use_abs: true
      better: lower
    rmse_extreme1_tol:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 1
      cond_on_target_lt: ~
      abs_tol: 0.02
      use_abs: true
      better: lower

    nse:
      type: cal_nse_pt
      reduction: mean
      better: higher
    nse_safe:
      type: cal_nse_pt_safe
      reduction: mean
      min_var: 1.0e-6
      abs_tol_per_px: 1.0e-4
      lower_bound: -5.0
      better: higher
    nse_thr01_safe:
      type: cal_nse_threshold_pt_safe
      reduction: mean
      min_var: 1.0e-6
      abs_tol_per_px: 1.0e-4
      lower_bound: -5.0
      threshold: 0.1
      use_abs: true
      better: higher
    nse_thr01_tol_safe:
      type: cal_nse_threshold_tolerant_pt_safe
      reduction: mean
      min_var: 1.0e-6
      abs_tol_per_px: 1.0e-4
      lower_bound: -5.0
      threshold: 0.1
      abs_tol: 0.02
      use_abs: true
      better: higher

    csi_thr01:
      type: cal_csi_pt
      threshold: 0.1
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    csi_thr01_tol:
      type: cal_csi_tolerant_pt
      threshold: 0.1
      reduction: mean
      abs_tol: 0.02
      empty_as_nan: true
      use_abs: true
      better: higher

    precision_thr01:
      type: cal_precision_pt
      threshold: 0.1
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    precision_thr01_tol:
      type: cal_precision_tolerant_pt
      threshold: 0.1
      reduction: mean
      empty_as_nan: true
      abs_tol: 0.02
      use_abs: true
      better: higher
    precision_nonflood01:
      type: cal_precision_band_pt
      band_ge: 0.0
      band_lt: 0.1
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    precision_slight01_05:
      type: cal_precision_band_pt
      band_ge: 0.1
      band_lt: 0.5
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    precision_severe05_1:
      type: cal_precision_band_pt
      band_ge: 0.5
      band_lt: 1
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    precision_extreme1:
      type: cal_precision_band_pt
      band_ge: 1
      band_lt: ~
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher

    recall_thr01:
      type: cal_recall_pt
      threshold: 0.1
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    recall_thr01_tol:
      type: cal_recall_tolerant_pt
      threshold: 0.1
      reduction: mean
      empty_as_nan: true
      abs_tol: 0.02
      use_abs: true
      better: higher
    recall_nonflood01:
      type: cal_recall_band_pt
      band_ge: 0.0
      band_lt: 0.1
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    recall_slight01_05:
      type: cal_recall_band_pt
      band_ge: 0.1
      band_lt: 0.5
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    recall_severe05_1:
      type: cal_recall_band_pt
      band_ge: 0.5
      band_lt: 1
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    recall_extreme1:
      type: cal_recall_band_pt
      band_ge: 1
      band_lt: ~
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher

    target_prevalence:
      type: cal_prev_t_pt
      threshold: 0.1
      reduction: mean
      use_abs: true
    pred_prevalence:
      type: cal_prev_p_pt
      threshold: 0.1
      reduction: mean
      use_abs: true

    accuracy_thr01:
      type: cal_accuracy_pt
      threshold: 0.1
      reduction: mean
      use_abs: true
      better: higher
