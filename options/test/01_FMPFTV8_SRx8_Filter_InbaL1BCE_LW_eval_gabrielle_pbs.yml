# Evaluation config — 01 FMPFTV8 (TG-PFT) main model, final checkpoint, on the Cyclone Gabrielle real-event test set (Gisborne).
# Flood depth (h), 8x downscaling (64 m -> 8 m). Saves predicted flood maps for
# global-metric aggregation via tools/eval_flood.py. Inputs normalized with
# train-set statistics (asinh + z-score, q=90); EMA weights loaded (params_ema).
# general settings
name: 01_FMPFTV8_SRx8_Filter_InbaL1BCE_LW_eval_gabrielle_pbs
model_type: FMSRModel
scale: 8
num_gpu: 1
manual_seed: 61

# dataset and data loader lsettings
datasets:
  test_1:
    name: FloodMapSR-Test-Gabrielle-h
    type: PairedFloodMapDataset
    dataroot: /esi/project/niwa04345/luoz/AIFloodModel/testdataset_gabrielle
    index_csv: /esi/project/niwa04345/luoz/AIFloodModel/testdataset_gabrielle/index_niwa.csv
    io_backend:
      type: disk

    phase: test
    target_var: h
    aux_vars: [zs, dem]
    scale: 8
    patch_fine: 512
    patch_coarse: 64

    split_cfg:
      by: scenario
      val_ratio: 0.2
      seed: 61
      split_stats_json: /esi/project/niwa04345/luoz/AIFloodModel/dataset_ds8_filtered_thr0p1_min5100_full/split_stats_h_asinh.json
    stats:
      calculate_if_missing: false
      use_clip_coarse: false
      use_clip_static: false
      norm: zscore
      transform: asinh
      h_asinh_q: 90

# network structures
network_g:
  type: FloodMapPFTV8
  upscale: 8
  coarse_in_chans: 3
  static_in_chans: 7
  flood_map_size: 64
  use_shallow_act: true
  use_decoder_act: true
  use_global_residual: true
  use_aoi_gate: true
  aoi_alpha: 0.5
  couple_mode: none
  couple_eps: 0.2
  embed_dim: 96
  depths: [2, 4, 6, 6]
  num_heads: 6
  num_topk: [ 256, 256,
              128, 128, 128, 128,
              64, 64, 64, 64, 64, 64,
              32, 32, 32, 32, 32, 32,]
  window_size: 16
  convffn_kernel_size: 7
  mlp_ratio: 2.
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'
  use_checkpoint: false

# path
path:
  pretrain_network_g: /esi/project/niwa04345/luoz/AIFloodModel/experiments/01_FMPFTV8_SRx8_Filter_InbaL1BCE_LW_pbs/models/net_g_1000000.pth
  strict_load_g: yes
  # load the EMA weights into net_g (test mode never builds net_g_ema, and
  # resume_state is ignored outside training) so eval matches the EMA-based
  # validation numbers seen during training.
  param_key_g: params_ema

# validation settings
val:
  save_flood_map: true
  suffix: ~

  metrics:
    rmse:
      type: cal_rmse_pt
      reduction: mean
      better: lower
    rmse_thr:
      type: cal_rmse_threshold_pt
      reduction: mean
      threshold: 0.1
      better: lower
    rmse_thr_tol:
      type: cal_rmse_threshold_tolerant_pt
      reduction: mean
      threshold: 0.1
      abs_tol: 0.02
      better: lower
    rmse_all:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: ~
      better: lower
    rmse_nonflood01:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.0
      cond_on_target_lt: 0.1
      better: lower
    rmse_nonflood01_tol:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.0
      cond_on_target_lt: 0.1
      abs_tol: 0.02
      better: lower
    rmse_slight01_05:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.1
      cond_on_target_lt: 0.5
      better: lower
    rmse_slight01_05_tol:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.1
      cond_on_target_lt: 0.5
      abs_tol: 0.02
      better: lower
    rmse_severe05_1:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.5
      cond_on_target_lt: 1
      better: lower
    rmse_severe05_1_tol:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.5
      cond_on_target_lt: 1
      abs_tol: 0.02
      better: lower
    rmse_extreme1:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 1
      cond_on_target_lt: ~
      better: lower
    rmse_extreme1_tol:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 1
      cond_on_target_lt: ~
      abs_tol: 0.02
      better: lower

    nse:
      type: cal_nse_pt
      reduction: mean
      better: higher
    nse_safe:
      type: cal_nse_pt_safe
      reduction: mean
      min_var: 1.0e-6
      abs_tol_per_px: 1.0e-4
      lower_bound: -5.0
