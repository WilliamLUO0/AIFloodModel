# Paper 2 S8 -- Flood-DM (pixel-space variant of Flood-LDM, Neo et al. 2026, WACV) under our protocol.
# Data side = 01 (sampler, flips/rot, batch 4 x 4, seed 61, our 10 input channels); model side = theirs
# (SR3 UNet 316,586,241 params, eps-prediction, L1 on the noise, Adam 1e-5 + 10 k warm-up, constant, T = 1000).
# = 01_FMPFTV8_SRx8_Filter_InbaL1BCE_LW except name / model_type / network_g / diffusion / train / val (256-patch subset, no logit metrics).
# general settings
name: 08_FloodDM_SRx8_Filter_EpsL1_lr1e-5_pbs
model_type: FloodDiffusionModel
scale: 8
num_gpu: 4
manual_seed: 61

# find_unused_parameters needs to be true, otherwise it will affect performance
find_unused_parameters: true

# dataset and data loader lsettings
datasets:
  train:
    name: FloodMapSR-Train-h
    type: PairedFloodMapDataset
    dataroot: /esi/project/niwa04345/luoz/AIFloodModel/dataset_ds8_filtered_thr0p1_min5100_full
    index_csv: /esi/project/niwa04345/luoz/AIFloodModel/dataset_ds8_filtered_thr0p1_min5100_full/index_with_interval_stats_h_niwa.csv
    io_backend:
      type: disk

    phase: train
    target_var: h
    aux_vars: [zs, dem]
    scale: 8
    patch_fine: 512
    patch_coarse: 64
    use_hflip: true
    use_rot: true

    split_cfg:
      by: scenario
      val_ratio: 0.2
      seed: 61
      split_stats_json: /esi/project/niwa04345/luoz/AIFloodModel/dataset_ds8_filtered_thr0p1_min5100_full/split_stats_h_asinh.json
    stats:
      calculate_if_missing: false
      use_clip_coarse: false
      use_clip_static: false
      norm: zscore
      transform: asinh
      h_asinh_q: 90
    sampler:
      type: interval_balanced
      score_mode: percentile_band
      summary_json: /esi/project/niwa04345/luoz/AIFloodModel/dataset_ds8_filtered_thr0p1_min5100_full/patch_interval_summary_h.json
      percentile_source: positive
      low_percentile: p75
      high_percentile: p99
      slight_alpha: 4.0
      severe_alpha: 2.0
      extreme_alpha: 2.0
      base_weight: 1.0
      max_weight: 10.0

    # data loader
    num_worker_per_gpu: 8
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: cuda
    pin_memory: True
    persistent_workers: True

  val_1:
    name: FloodMapSR-Val-h
    type: PairedFloodMapDataset
    dataroot: /esi/project/niwa04345/luoz/AIFloodModel/dataset_ds8_filtered_thr0p1_min5100_full
    index_csv: /esi/project/niwa04345/luoz/AIFloodModel/dataset_ds8_filtered_thr0p1_min5100_full/index_with_interval_stats_h_niwa.csv
    io_backend:
      type: disk

    phase: val
    subset_n: 256                # fixed seeded subset (sampling the full split is too slow)
    subset_seed: 61
    target_var: h
    aux_vars: [zs, dem]
    scale: 8
    patch_fine: 512
    patch_coarse: 64

    split_cfg:
      by: scenario
      val_ratio: 0.2
      seed: 61
      split_stats_json: /esi/project/niwa04345/luoz/AIFloodModel/dataset_ds8_filtered_thr0p1_min5100_full/split_stats_h_asinh.json
    stats:
      calculate_if_missing: false
      use_clip_coarse: false
      use_clip_static: false
      norm: zscore
      transform: asinh
      h_asinh_q: 90

# network structures
network_g:
  type: FloodSR3UNet           # Flood-DM denoiser = SR3 UNet ported from flood-diff (Apache-2.0); basicsr/archs/floodsr3unet_arch.py
  in_channel: 11               # cat[x_t (1), 3 coarse channels bilinear x8 (h, zs, dem), 7 fine statics]
  out_channel: 1
  inner_channel: 64
  norm_groups: 16
  channel_mults: [1, 2, 4, 8, 16]
  attn_res: [32]
  res_blocks: 3
  dropout: 0
  image_size: 512
  init_type: orthogonal        # as released (model/networks.py)
  grad_checkpoint: false       # true only if batch 4/GPU does not fit (memory fallback, ~+30 % time)

# diffusion process (FloodDiffusionModel; THEIR model side: SR3 noise level, linear beta, eps-prediction, DDPM sampler)
diffusion:
  schedule: linear
  n_timestep: 1000
  linear_start: !!float 1e-6
  linear_end: !!float 1e-2
  loss_type: l1                # L1 on the noise as in the released configs (*-5-01norm.json); the paper text says L2
  asinh_range: 4.0             # x0 = 2*asinh(h/s)/A - 1 (dry = -1), A > training asinh max 3.77; inverse -> z-space for eval
  stats_json: /esi/project/niwa04345/luoz/AIFloodModel/dataset_ds8_filtered_thr0p1_min5100_full/split_stats_h_asinh.json
  h_asinh_q: 90
  upsample_mode: bilinear      # coarse channels x8 (their coarse map is already on the fine raster)
  clip_denoised: true          # x0-hat clamped to [-1, 1] at every step, as released
  outside_aoi_replace: true    # outside-AOI pixels reset to the forward-noised dry value after every step (ruling)
  amp_dtype: bfloat16
  amp_train: true
  amp_sample: true
  t_start: 150                 # in-training validation (val_1 = 256-patch subset)
  n_samples: 1                 # headline = ONE seeded sample per patch (mean of 8 = SI row: n_samples 8)
  seed_base: 61                # per-patch generator seed = f(seed_base, scenario, t, row, col, var)
# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999             # ours (their code has no EMA) -- the EMA copy is what is evaluated
  optim_g:
    type: Adam
    lr: !!float 1e-5             # PILOT: 50 k vs the 1e-6 main run (ruling), stop or continue
    weight_decay: 0
    betas: [0.9, 0.999]

  scheduler:                   # constant after the warm-up, no decay (MultiStepLR without milestones)
    type: MultiStepLR
    milestones: []
    gamma: 1.0

  total_iter: 1000000
  warmup_iter: 10000           # linear warm-up as in their LDM recipe, then constant
  # no pixel_opt / ordinal_opt: the loss is the masked noise loss of FloodDiffusionModel (diffusion.loss_type)

# validation settings
val:
  val_freq: !!float 5e4          # 256-patch subset at t_start 150: ~20 min on rank 0
  save_flood_map: false

  metrics:
    rmse:
      type: cal_rmse_pt
      reduction: mean
      better: lower
    rmse_thr:
      type: cal_rmse_threshold_pt
      reduction: mean
      threshold: 0.1
      better: lower
    rmse_thr_tol:
      type: cal_rmse_threshold_tolerant_pt
      reduction: mean
      threshold: 0.1
      abs_tol: 0.02
      better: lower
    rmse_all:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: ~
      better: lower
    rmse_nonflood01:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.0
      cond_on_target_lt: 0.1
      better: lower
    rmse_nonflood01_tol:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.0
      cond_on_target_lt: 0.1
      abs_tol: 0.02
      better: lower
    rmse_slight01_05:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.1
      cond_on_target_lt: 0.5
      better: lower
    rmse_slight01_05_tol:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.1
      cond_on_target_lt: 0.5
      abs_tol: 0.02
      better: lower
    rmse_severe05_1:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.5
      cond_on_target_lt: 1
      better: lower
    rmse_severe05_1_tol:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.5
      cond_on_target_lt: 1
      abs_tol: 0.02
      better: lower
    rmse_extreme1:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 1
      cond_on_target_lt: ~
      better: lower
    rmse_extreme1_tol:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 1
      cond_on_target_lt: ~
      abs_tol: 0.02
      better: lower

    nse:
      type: cal_nse_pt
      reduction: mean
      better: higher
    nse_safe:
      type: cal_nse_pt_safe
      reduction: mean
      min_var: 1.0e-6
      abs_tol_per_px: 1.0e-4
      lower_bound: -5.0
      better: higher
    nse_thr01_safe:
      type: cal_nse_threshold_pt_safe
      reduction: mean
      min_var: 1.0e-6
      abs_tol_per_px: 1.0e-4
      lower_bound: -5.0
      threshold: 0.1
      better: higher
    nse_thr01_tol_safe:
      type: cal_nse_threshold_tolerant_pt_safe
      reduction: mean
      min_var: 1.0e-6
      abs_tol_per_px: 1.0e-4
      lower_bound: -5.0
      threshold: 0.1
      abs_tol: 0.02
      better: higher

    csi_thr01:
      type: cal_csi_pt
      threshold: 0.1
      reduction: mean
      empty_as_nan: true
      better: higher
    csi_thr01_tol:
      type: cal_csi_tolerant_pt
      threshold: 0.1
      reduction: mean
      abs_tol: 0.02
      empty_as_nan: true
      better: higher

    precision_thr01:
      type: cal_precision_pt
      threshold: 0.1
      reduction: mean
      empty_as_nan: true
      better: higher
    precision_thr01_tol:
      type: cal_precision_tolerant_pt
      threshold: 0.1
      reduction: mean
      empty_as_nan: true
      abs_tol: 0.02
      better: higher
    precision_nonflood01:
      type: cal_precision_band_pt
      band_ge: 0.0
      band_lt: 0.1
      reduction: mean
      empty_as_nan: true
      better: higher
    precision_slight01_05:
      type: cal_precision_band_pt
      band_ge: 0.1
      band_lt: 0.5
      reduction: mean
      empty_as_nan: true
      better: higher
    precision_severe05_1:
      type: cal_precision_band_pt
      band_ge: 0.5
      band_lt: 1
      reduction: mean
      empty_as_nan: true
      better: higher
    precision_extreme1:
      type: cal_precision_band_pt
      band_ge: 1
      band_lt: ~
      reduction: mean
      empty_as_nan: true
      better: higher

    recall_thr01:
      type: cal_recall_pt
      threshold: 0.1
      reduction: mean
      empty_as_nan: true
      better: higher
    recall_thr01_tol:
      type: cal_recall_tolerant_pt
      threshold: 0.1
      reduction: mean
      empty_as_nan: true
      abs_tol: 0.02
      better: higher
    recall_nonflood01:
      type: cal_recall_band_pt
      band_ge: 0.0
      band_lt: 0.1
      reduction: mean
      empty_as_nan: true
      better: higher
    recall_slight01_05:
      type: cal_recall_band_pt
      band_ge: 0.1
      band_lt: 0.5
      reduction: mean
      empty_as_nan: true
      better: higher
    recall_severe05_1:
      type: cal_recall_band_pt
      band_ge: 0.5
      band_lt: 1
      reduction: mean
      empty_as_nan: true
      better: higher
    recall_extreme1:
      type: cal_recall_band_pt
      band_ge: 1
      band_lt: ~
      reduction: mean
      empty_as_nan: true
      better: higher

    target_prevalence:
      type: cal_prev_t_pt
      threshold: 0.1
      reduction: mean
    pred_prevalence:
      type: cal_prev_p_pt
      threshold: 0.1
      reduction: mean

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e4   # ~5 GB per checkpoint+state; 50 k and 400 k are needed
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
